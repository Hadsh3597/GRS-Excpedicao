<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRS Entregas - Dashboard Executivo</title>
    <link rel="icon" type="image/png" href="https://cdn.grs.tec.br/carros/logo%20mini%20tech.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #5f0c16;
            --primary-hover: #43080f;
            --primary-light: #f9f0f1
        }

        body {
            background-color: #f4f6f9;
            color: #333
        }

        .navbar-custom {
            background: #fff;
            border-bottom: 1px solid #dee2e6;
            padding: .8rem 1.5rem
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            overflow: hidden
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain
        }

        .text-custom-primary {
            color: var(--primary-color) !important
        }

        .filter-bar {
            background: #fff;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
            margin-bottom: 1.5rem
        }

        .kpi-card {
            border: none;
            border-radius: 12px;
            transition: transform .2s ease, box-shadow .2s ease
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, .08) !important
        }

        .kpi-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem
        }

        .chart-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .04);
            background: #fff
        }

        .chart-card .card-header {
            background: transparent;
            border-bottom: 1px solid #f0f0f0;
            padding: 1rem 1.25rem;
            font-weight: 700;
            color: #333
        }

        .chart-container {
            position: relative;
            height: 280px;
            width: 100%
        }

        .copyright-text {
            font-size: .75rem;
            color: #6c757d;
            text-align: center;
            margin-top: 2rem;
            padding-bottom: 1rem;
            user-select: none
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-custom sticky-top shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <div class="logo-container"><img src="https://cdn.grs.tec.br/carros/logo%20mini%20tech.png"
                        alt="Logo GRS"></div>
                <h4 class="m-0 fw-bold text-custom-primary">GRS Analytics</h4>
            </div>
            <div class="d-flex align-items-center gap-3"><span
                    class="badge bg-light text-dark border py-2 px-3 shadow-sm" id="indicador-atualizacao">🔄
                    Sincronizado</span></div>
        </div>
    </nav>
    <main class="container-fluid px-4 pt-4">
        <div class="filter-bar">
            <div class="row g-3 align-items-end">
                <div class="col-md-3"><label class="form-label small fw-bold text-muted mb-1">📅 Período
                        Rápido</label><select id="filtro-preset" class="form-select form-select-sm"
                        onchange="aplicarPresetData(this.value)">
                        <option value="hoje">Hoje</option>
                        <option value="7dias">Últimos 7 dias</option>
                        <option value="esteMes" selected>Este Mês</option>
                        <option value="todos">Todo o Histórico</option>
                        <option value="custom">Personalizado...</option>
                    </select></div>
                <div class="col-md-3"><label class="form-label small fw-bold text-muted mb-1">Data Inicial</label><input
                        type="date" id="data-inicio" class="form-control form-control-sm"
                        onchange="marcarCustomEFiltrar()"></div>
                <div class="col-md-3"><label class="form-label small fw-bold text-muted mb-1">Data Final</label><input
                        type="date" id="data-fim" class="form-control form-control-sm"
                        onchange="marcarCustomEFiltrar()"></div>
                <div class="col-md-3 d-flex gap-2"><button class="btn btn-sm btn-primary w-100 fw-bold"
                        onclick="processarEFiltrarDados()">🔍 Filtrar</button><button
                        class="btn btn-sm btn-outline-secondary" onclick="limparFiltros()"
                        title="Limpar Filtros">🔄</button></div>
            </div>
        </div>
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card kpi-card shadow-sm p-3 bg-white">
                    <div class="d-flex align-items-center justify-content-between">
                        <div><span class="text-muted small fw-bold text-uppercase d-block mb-1">Entregas
                                Realizadas</span>
                            <h2 class="fw-bold m-0 text-success" id="kpi-entregue">0</h2>
                        </div>
                        <div class="kpi-icon bg-success-subtle text-success">✅</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card kpi-card shadow-sm p-3 bg-white">
                    <div class="d-flex align-items-center justify-content-between">
                        <div><span class="text-muted small fw-bold text-uppercase d-block mb-1">Retornos /
                                Pendentes</span>
                            <h2 class="fw-bold m-0 text-danger" id="kpi-retorno">0</h2>
                        </div>
                        <div class="kpi-icon bg-danger-subtle text-danger">⚠️</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card kpi-card shadow-sm p-3 bg-white">
                    <div class="d-flex align-items-center justify-content-between">
                        <div><span class="text-muted small fw-bold text-uppercase d-block mb-1">Faturamento Total</span>
                            <h2 class="fw-bold m-0 text-primary" id="kpi-valor-total">R$ 0,00</h2>
                        </div>
                        <div class="kpi-icon bg-primary-subtle text-primary">💰</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-4 mb-4">
            <div class="col-lg-4">
                <div class="card chart-card">
                    <div class="card-header">👥 Top 10 Vendedores</div>
                    <div class="card-body">
                        <div class="chart-container"><canvas id="chartVendedores"></canvas></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card chart-card">
                    <div class="card-header">🛵 Entregas por Motoboy</div>
                    <div class="card-body">
                        <div class="chart-container"><canvas id="chartMotoboys"></canvas></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card chart-card">
                    <div class="card-header">💳 Tipos de Pagamento</div>
                    <div class="card-body">
                        <div class="chart-container"><canvas id="chartPagamentos"></canvas></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card chart-card">
                    <div class="card-header">📈 Evolução de Valores (R$) e Entregas</div>
                    <div class="card-body">
                        <div class="chart-container" style="height:300px"><canvas id="chartEvolucao"></canvas></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card chart-card">
                    <div class="card-header">⏰ Horários de Maior Volume</div>
                    <div class="card-body">
                        <div class="chart-container" style="height:300px"><canvas id="chartHorarios"></canvas></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="copyright-text">© 2026 GRS LAB. Todos os direitos reservados.</div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        const firebaseConfig = { apiKey: "AIzaSyCVNEMoCrzed5Pn6leILGJd-hgNAbWyo2E", authDomain: "sistema-de-entregas-89bab.firebaseapp.com", databaseURL: "https://sistema-de-entregas-89bab-default-rtdb.firebaseio.com", projectId: "sistema-de-entregas-89bab", storageBucket: "sistema-de-entregas-89bab.firebasestorage.app", messagingSenderId: "383878275976", appId: "1:383878275976:web:4f2d952e2af82ff0c1503d", measurementId: "G-30BH511H4Y" };
        const app = initializeApp(firebaseConfig), db = getDatabase(app), dbRefEntregas = ref(db, 'entregas'), dbRefMotoboys = ref(db, 'configuracoes/motoboys');
        const nomesMotoboys = { '1': { nome: 'Wellington', cor: '#198754' }, '2': { nome: 'Rogerio', cor: '#0d6efd' }, '3': { nome: 'Giovane', cor: '#ffc107' }, '4': { nome: 'Djavan', cor: '#dc3545' } };
        const padrao = JSON.parse(JSON.stringify(nomesMotoboys));
        let todastEntregasGlobais = [], namesReady = false, instanceVendedores, instanceMotoboys, instancePagamentos, instanceEvolucao, instanceHorarios;
        const safe = v => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        function atualizarNomes(dados) { Object.keys(padrao).forEach(id => nomesMotoboys[id].nome = String(dados?.[id]?.nome || padrao[id].nome)); namesReady = true; document.getElementById('indicador-atualizacao').textContent = '🔄 Sincronizado'; processarEFiltrarDados(); }
        onValue(dbRefMotoboys, s => atualizarNomes(s.val() || padrao), e => { console.error(e); atualizarNomes(padrao); });
        onValue(dbRefEntregas, s => { const data = s.val(); todastEntregasGlobais = []; if (data) Object.keys(data).forEach(k => todastEntregasGlobais.push({ ...data[k], firebaseKey: k })); processarEFiltrarDados(); });
        function formatarNomeVendedor(nome) { if (!nome || typeof nome !== 'string') return 'Indefinido'; const limpo = nome.trim().toLowerCase(); return limpo ? limpo.split(/\s+/).map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ') : 'Indefinido'; }
        window.aplicarPresetData = function (tipo) { const hoje = new Date(), fmt = d => d.toISOString().split('T')[0]; if (tipo === 'hoje') { document.getElementById('data-inicio').value = fmt(hoje); document.getElementById('data-fim').value = fmt(hoje); } else if (tipo === '7dias') { const inicio = new Date(); inicio.setDate(hoje.getDate() - 6); document.getElementById('data-inicio').value = fmt(inicio); document.getElementById('data-fim').value = fmt(hoje); } else if (tipo === 'esteMes') { const inicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1); document.getElementById('data-inicio').value = fmt(inicio); document.getElementById('data-fim').value = fmt(hoje); } else if (tipo === 'todos') { document.getElementById('data-inicio').value = ''; document.getElementById('data-fim').value = ''; } processarEFiltrarDados(); };
        window.marcarCustomEFiltrar = function () { document.getElementById('filtro-preset').value = 'custom'; processarEFiltrarDados(); };
        window.limparFiltros = function () { document.getElementById('filtro-preset').value = 'esteMes'; aplicarPresetData('esteMes'); };
        window.processarEFiltrarDados = function () { const ini = document.getElementById('data-inicio').value, fim = document.getElementById('data-fim').value; const filtradas = todastEntregasGlobais.filter(e => { const d = String(e.data_lancamento || '').substring(0, 10); if (!d) return true; if (ini && d < ini) return false; if (fim && d > fim) return false; return true; }); atualizarDashboard(filtradas); };
        function atualizarDashboard(entregas) {
            let totalEntregues = 0, totalRetornoOuPendente = 0, valorTotal = 0; const vendedoresCount = {}, motoboysMap = {}, pagamentosCount = {}, horariosCount = {}, datasAgrupadas = {}; entregas.forEach(e => { if (e.status === 'Entregue') totalEntregues++; if (e.status === 'Não Entregue' || e.status === 'Pendente') totalRetornoOuPendente++; valorTotal += parseFloat(e.valor || 0); const v = formatarNomeVendedor(e.vendedor); vendedoresCount[v] = (vendedoresCount[v] || 0) + 1; const info = nomesMotoboys[e.motoboy] || { nome: 'Outro', cor: '#6c757d' }; if (!motoboysMap[info.nome]) motoboysMap[info.nome] = { count: 0, cor: info.cor }; motoboysMap[info.nome].count++; const p = e.pagamento || 'Outro'; pagamentosCount[p] = (pagamentosCount[p] || 0) + 1; const h = e.hora_entrada ? e.hora_entrada.split(':')[0] + ':00' : 'Outro'; horariosCount[h] = (horariosCount[h] || 0) + 1; const data = e.data_lancamento || 'Indefinida'; if (!datasAgrupadas[data]) datasAgrupadas[data] = { qtd: 0, valor: 0 }; datasAgrupadas[data].qtd++; datasAgrupadas[data].valor += parseFloat(e.valor || 0); });
            document.getElementById('kpi-entregue').textContent = totalEntregues.toLocaleString('pt-BR'); document.getElementById('kpi-retorno').textContent = totalRetornoOuPendente.toLocaleString('pt-BR'); document.getElementById('kpi-valor-total').textContent = `R$ ${valorTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            renderizarGraficos({ vendedores: Object.entries(vendedoresCount).sort((a, b) => b[1] - a[1]).slice(0, 10), motoboys: Object.entries(motoboysMap).sort((a, b) => b[1].count - a[1].count), pagamentos: Object.entries(pagamentosCount).sort((a, b) => b[1] - a[1]), horarios: Object.entries(horariosCount).sort((a, b) => b[1] - a[1]), datas: Object.keys(datasAgrupadas).sort(), evolucao: datasAgrupadas });
        }
        function renderizarGraficos(d) {
            [instanceVendedores, instanceMotoboys, instancePagamentos, instanceEvolucao, instanceHorarios].forEach(x => x?.destroy());
            instanceVendedores = new Chart(document.getElementById('chartVendedores'), { type: 'bar', data: { labels: d.vendedores.map(v => v[0]), datasets: [{ label: 'Entregas', data: d.vendedores.map(v => v[1]), backgroundColor: '#0d6efd', borderRadius: 6 }] }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
            instanceMotoboys = new Chart(document.getElementById('chartMotoboys'), { type: 'bar', data: { labels: d.motoboys.map(m => m[0]), datasets: [{ label: 'Entregas', data: d.motoboys.map(m => m[1].count), backgroundColor: d.motoboys.map(m => m[1].cor), borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
            instancePagamentos = new Chart(document.getElementById('chartPagamentos'), { type: 'doughnut', data: { labels: d.pagamentos.map(p => p[0]), datasets: [{ data: d.pagamentos.map(p => p[1]), backgroundColor: ['#0d6efd', '#198754', '#6f42c1', '#fd7e14', '#ffc107', '#6c757d'] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } });
            instanceEvolucao = new Chart(document.getElementById('chartEvolucao'), { type: 'line', data: { labels: d.datas, datasets: [{ label: 'Faturamento (R$)', data: d.datas.map(x => d.evolucao[x].valor), borderColor: '#198754', backgroundColor: 'rgba(25,135,84,.1)', fill: true, tension: .3, yAxisID: 'y' }, { label: 'Qtd Entregas', data: d.datas.map(x => d.evolucao[x].qtd), borderColor: '#0d6efd', tension: .3, yAxisID: 'y1' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Valor (R$)' } }, y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Entregas' } } } } });
            instanceHorarios = new Chart(document.getElementById('chartHorarios'), { type: 'bar', data: { labels: d.horarios.map(h => h[0]), datasets: [{ label: 'Entregas', data: d.horarios.map(h => h[1]), backgroundColor: '#0dcaf0', borderRadius: 4 }] }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
        }
        document.addEventListener('DOMContentLoaded', () => { aplicarPresetData('esteMes'); });
    </script>
</body>

</html>
